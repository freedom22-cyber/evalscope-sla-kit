<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>evalscope 摸高测试控制台</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
         background: #f5f6f8; color: #1f2430; font-size: 14px; }
  .app { display: flex; min-height: 100vh; }
  .sidebar { width: 220px; flex: 0 0 220px; background: #1f2430; color: #c8ccd4;
             display: flex; flex-direction: column; }
  .brand { padding: 18px 20px; font-size: 15px; font-weight: 600; color: #fff;
           border-bottom: 1px solid #2c333f; line-height: 1.4; }
  .brand small { display: block; font-weight: 400; color: #8b93a1; font-size: 11px; margin-top: 4px; }
  .nav { padding: 10px 0; flex: 1; }
  .nav a { display: flex; align-items: center; gap: 10px; padding: 12px 20px; color: #c8ccd4;
           text-decoration: none; cursor: pointer; border-left: 3px solid transparent; }
  .nav a:hover { background: #262d3a; color: #fff; }
  .nav a.active { background: #2b3442; color: #fff; border-left-color: #4c8dff; }
  .nav .badge { background: #3a4454; border-radius: 10px; padding: 1px 8px; font-size: 11px; margin-left: auto; }
  .sidebar .foot { padding: 14px 20px; font-size: 11px; color: #6b7382; border-top: 1px solid #2c333f; }
  .main { flex: 1; padding: 22px 28px; overflow: auto; }
  h1 { font-size: 19px; margin: 0 0 4px; }
  .sub { color: #6b7382; margin-bottom: 18px; font-size: 12px; }
  .card { background: #fff; border: 1px solid #e4e7ec; border-radius: 10px; padding: 18px 20px;
          margin-bottom: 16px; box-shadow: 0 1px 2px rgba(16,24,40,.04); }
  .card h2 { font-size: 14px; margin: 0 0 14px; display: flex; align-items: center; gap: 8px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 20px; }
  .field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px; }
  .field label { font-size: 12px; color: #475467; font-weight: 500; }
  .field input[type=text], .field input[type=number], .field select {
      padding: 7px 10px; border: 1px solid #d0d5dd; border-radius: 6px; font-size: 13px; outline: none; }
  .field input:focus, .field select:focus { border-color: #4c8dff; box-shadow: 0 0 0 3px rgba(76,141,255,.12); }
  .field .hint { font-size: 11px; color: #98a2b3; }
  .switch { display: flex; align-items: center; gap: 8px; }
  .switch input { width: 16px; height: 16px; }
  button { padding: 8px 16px; border: 1px solid #d0d5dd; background: #fff; border-radius: 7px;
           font-size: 13px; cursor: pointer; color: #344054; }
  button:hover { background: #f9fafb; }
  button.primary { background: #3b6fe0; border-color: #3b6fe0; color: #fff; }
  button.primary:hover { background: #325fc7; }
  button.danger { color: #b42318; border-color: #fecdca; }
  button.small { padding: 4px 10px; font-size: 12px; }
  .row-actions { margin-top: 6px; display: flex; gap: 10px; flex-wrap: wrap; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #eef0f3; }
  th { color: #667085; font-weight: 600; background: #fafbfc; }
  tr:hover td { background: #fafbfc; }
  code { background: #f2f4f7; padding: 1px 6px; border-radius: 4px; font-size: 12px; }
  .pill { display: inline-block; padding: 2px 9px; border-radius: 20px; font-size: 11px; font-weight: 600; }
  .pill.done { background: #e7f6ec; color: #067647; }
  .pill.running { background: #e8f0fe; color: #1a56db; }
  .pill.pending { background: #f2f4f7; color: #667085; }
  .pill.error { background: #fef3f2; color: #b42318; }
  .pill.not_started { background: #f2f4f7; color: #98a2b3; }
  .pill.stopped { background: #fff6e5; color: #b54708; }
  .pill.interrupted { background: #fff6e5; color: #b54708; }
  .muted { color: #98a2b3; }
  .toast { position: fixed; right: 20px; bottom: 20px; background: #1f2430; color: #fff;
           padding: 10px 16px; border-radius: 8px; font-size: 13px; opacity: 0; transition: .2s; z-index: 99; }
  .toast.show { opacity: .95; }
  .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
  .toolbar .spacer { flex: 1; }
  pre.log { background: #0f1420; color: #cdd6e4; padding: 14px; border-radius: 8px; max-height: 420px;
            overflow: auto; font-size: 12px; line-height: 1.5; white-space: pre-wrap; }
  dialog { border: none; border-radius: 12px; padding: 0; width: min(940px, 94vw); max-height: 90vh; }
  dialog::backdrop { background: rgba(16,24,40,.45); }
  .dlg-head { padding: 16px 20px; border-bottom: 1px solid #eef0f3; display: flex; align-items: center; gap: 10px; }
  .dlg-head h3 { margin: 0; font-size: 15px; flex: 1; }
  .dlg-body { padding: 18px 20px; overflow: auto; max-height: 74vh; }
  .kv { display: grid; grid-template-columns: 130px 1fr; gap: 6px 12px; font-size: 12.5px; margin-bottom: 14px; }
  .kv .k { color: #667085; }
  .kv .v { color: #1f2430; word-break: break-all; }
  .proj-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }
  .proj-card { border: 1px solid #e4e7ec; border-radius: 10px; padding: 16px; background: #fff; }
  .proj-card h3 { margin: 0 0 6px; font-size: 14px; }
  .proj-card .meta { font-size: 12px; color: #667085; margin-bottom: 10px; }
  .proj-card .bar { height: 6px; border-radius: 3px; background: #eef0f3; overflow: hidden; margin: 8px 0; }
  .proj-card .bar > div { height: 100%; background: #3b6fe0; }
  .back { font-size: 13px; color: #3b6fe0; cursor: pointer; margin-bottom: 12px; display: inline-block; }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">evalscope 摸高测试<small>SLA Peak Search Console</small></div>
    <nav class="nav" id="nav">
      <a data-view="config" class="active">⚙️ 配置项</a>
      <a data-view="cases">🧪 测试用例 <span class="badge" id="badge-cases">-</span></a>
      <a data-view="projects">📦 测试工程 <span class="badge" id="badge-projects">-</span></a>
    </nav>
    <div class="foot">后端: FastAPI · 端口 8300</div>
  </aside>
  <main class="main" id="main"></main>
</div>
<div class="toast" id="toast"></div>
<dialog id="dlg"><div class="dlg-head"><h3 id="dlg-title">详情</h3>
  <button class="small" onclick="document.getElementById('dlg').close()">关闭</button></div>
  <div class="dlg-body" id="dlg-body"></div></dialog>

<script>
const $ = (s, r=document) => r.querySelector(s);
const el = (t, a={}, ...kids) => {
  const e = document.createElement(t);
  for (const k in a) {
    if (k === 'html') e.innerHTML = a[k];
    else if (k === 'cls') e.className = a[k];
    else if (k === 'style') e.setAttribute('style', a[k]);
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), a[k]);
    else e.setAttribute(k, a[k]);
  }
  for (const k of kids) e.append(k);
  return e;
};
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2600); }
async function api(path, opts={}) {
  const r = await fetch(path, { headers: {'Content-Type':'application/json'}, ...opts });
  return await r.json();
}
const STATUS_CN = { done:'已完成', running:'进行中', pending:'排队中', error:'失败',
  not_started:'未开始', stopped:'已停止', interrupted:'已中断' };
function pill(s) { return '<span class="pill ' + (s||'not_started') + '">' + (STATUS_CN[s]||s||'未开始') + '</span>'; }
const kfmt = n => (n && n % 1024 === 0) ? (n/1024)+'k' : n;
const hitfmt = h => (h===0||h==null) ? '0%' : (h*100).toFixed(0)+'%';

let VIEW = 'config';
let CURRENT_PROJECT = null;   // 打开中的工程 id

/* ============================ 配置项视图 ============================ */
async function renderConfig() {
  const cfg = await api('/api/config');
  const m = $('#main'); m.innerHTML = '';
  m.append(el('h1', {}, '配置项'));
  m.append(el('div', {cls:'sub'}, '配置被测服务与摸高参数；保存后写入 web_state.json（不覆盖 config.yaml 注释）'));

  const svc = cfg.service||{}, req = cfg.request||{}, bench = cfg.benchmark||{};
  const card = el('div', {cls:'card'});
  card.append(el('h2', {}, '🔌 服务配置'));
  const g = el('div', {cls:'grid2'});
  g.append(field('服务 URL', 'url', svc.url||'', '完整 chat completions 路径'));
  g.append(field('模型名 (model)', 'model', svc.model||'', '服务端 served model 名'));
  g.append(field('Tokenizer 路径', 'tokenizer_path', svc.tokenizer_path||'', '模型权重路径（长度过滤/数据集生成用）'));
  g.append(field('API Key（可选）', 'api_key', req.api_key||'', '设置后自动加 Authorization: Bearer'));
  card.append(g);

  card.append(el('h2', {style:'margin-top:18px'}, '🌐 请求头 / Host'));
  const hg = el('div', {cls:'grid2'});
  const hostChk = el('div', {cls:'field'});
  hostChk.innerHTML = '<label>请求头加 Host 参数</label>'
    + '<div class="switch"><input type="checkbox" id="addhost" ' + (req.add_host_header?'checked':'') + '>'
    + '<span class="hint">LB/网关按域名路由时开启</span></div>';
  hg.append(hostChk);
  hg.append(field('Host 值', 'host_header', req.host_header||'', '留空 = 自动取 URL 主机名'));
  hg.append(field('额外请求头', 'extra_headers', (req.extra_headers||[]).join(', '), '逗号分隔，如 Authorization=Bearer xxx'));
  card.append(hg);
  card.append(el('div', {cls:'hint', style:'margin-top:6px'},
    '生效请求头: ' + ((cfg.host_header_effective||[]).join(' | ') || '（无）')));

  card.append(el('h2', {style:'margin-top:18px'}, '🎯 摸高参数'));
  const bg = el('div', {cls:'grid2'});
  bg.append(field('并发下界', 'sla_lower_bound', bench.sla_lower_bound, '', 'number'));
  bg.append(field('并发上界', 'sla_upper_bound', bench.sla_upper_bound, '', 'number'));
  bg.append(field('每档轮数', 'sla_num_runs', bench.sla_num_runs, '', 'number'));
  bg.append(field('请求数倍数', 'number_multiplier', bench.number_multiplier, '请求数 = 并发 × 倍数', 'number'));
  bg.append(field('warmup 请求数', 'warmup_num', bench.warmup_num, '', 'number'));
  bg.append(field('worker 进程数', 'num_workers', bench.num_workers||0, '0=自动，内存受限机器设 1', 'number'));
  card.append(bg);

  const actions = el('div', {cls:'row-actions'});
  actions.append(el('button', {cls:'primary', onclick: saveConfig}, '💾 保存服务配置'));
  actions.append(el('button', {onclick: renderConfig}, '重置'));
  card.append(actions);
  m.append(card);
}

function field(label, id, val, hint='', type='text') {
  const f = el('div', {cls:'field'});
  f.innerHTML = '<label>'+label+'</label>'
    + '<input type="'+type+'" id="cfg-'+id+'" value="'+(val===undefined||val===null?'':val)+'">'
    + (hint?('<span class="hint">'+hint+'</span>'):'');
  return f;
}

async function saveConfig() {
  const payload = {
    service: { url: $('#cfg-url').value, model: $('#cfg-model').value,
               tokenizer_path: $('#cfg-tokenizer_path').value },
    request: { add_host_header: $('#addhost').checked, host_header: $('#cfg-host_header').value,
               api_key: $('#cfg-api_key').value,
               extra_headers: $('#cfg-extra_headers').value.split(',').map(x=>x.trim()).filter(Boolean) },
    benchmark: { sla_lower_bound: +$('#cfg-sla_lower_bound').value,
                 sla_upper_bound: +$('#cfg-sla_upper_bound').value,
                 sla_num_runs: +$('#cfg-sla_num_runs').value,
                 number_multiplier: +$('#cfg-number_multiplier').value,
                 warmup_num: +$('#cfg-warmup_num').value,
                 num_workers: +$('#cfg-num_workers').value }
  };
  const r = await api('/api/config', {method:'POST', body: JSON.stringify(payload)});
  toast(r.ok ? '服务配置已保存' : '保存失败');
  renderConfig();
}

/* ============================ 测试用例视图 ============================ */
async function renderCases() {
  const {cases} = await api('/api/cases');
  const m = $('#main'); m.innerHTML = '';
  m.append(el('h1', {}, '测试用例'));
  m.append(el('div', {cls:'sub'},
    '用例即一个固定测试场景；gsm8k 用例可设置数据集条数，「检测数据集是否生成」会补齐未生成的数据集（相同长度/命中率自动复用）'));

  const bar = el('div', {cls:'toolbar'});
  bar.append(el('button', {cls:'primary', onclick: detectDatasets}, '🔍 检测数据集是否生成'));
  bar.append(el('button', {cls:'danger', onclick: () => genDatasets(true)}, '♻️ 强制重新生成未生成集'));
  bar.append(el('span', {cls:'spacer'}));
  bar.append(el('span', {cls:'muted'}, el('a', {href:'#', onclick:(e)=>{e.preventDefault();renderCases()}}, '刷新')));
  m.append(bar);

  const card = el('div', {cls:'card'});
  card.append(el('h2', {}, '📋 用例列表（' + cases.length + '）'));
  const tb = el('table');
  tb.innerHTML = '<thead><tr><th>启用</th><th>用例 ID</th><th>数据集</th><th>输入</th>'
    + '<th>输出</th><th>命中</th><th>TTFT SLA</th><th>TPOT SLA</th>'
    + '<th>数据集条数</th><th>数据集状态</th><th>操作</th></tr></thead>';
  const tbody = el('tbody');
  cases.forEach(c => {
    const tr = el('tr');
    tr.dataset.id = c.id;
    const dsCell = (c.dataset === 'gsm8k')
      ? '<input type="number" class="dsnum" style="width:78px" value="' + (c.dataset_num||'') + '" placeholder="默认"> '
        + '<button class="small" data-gen="' + c.id + '">生成</button>'
      : '<span class="muted">—</span>';
    const stCell = (c.dataset === 'gsm8k')
      ? (c.dataset_exists
          ? '<span class="pill done">已生成</span>' + (c.dataset_shared?' <span class="muted">复用</span>':'')
          : '<span class="pill not_started">未生成</span>')
      : '<span class="muted">在线生成</span>';
    tr.innerHTML =
      '<td><input type="checkbox" class="en" ' + (c.enabled!==false?'checked':'') + '></td>'
      + '<td><code>' + c.id + '</code></td>'
      + '<td>' + c.dataset + '</td>'
      + '<td>' + kfmt(c.input_len) + '</td>'
      + '<td>' + kfmt(c.output_len) + '</td>'
      + '<td>' + hitfmt(c.hit_rate) + '</td>'
      + '<td>' + c.ttft_sla_ms + ' ms</td>'
      + '<td>' + c.tpot_sla_ms + ' ms</td>'
      + '<td>' + dsCell + '</td>'
      + '<td>' + stCell + '</td>'
      + '<td><button class="small danger" data-del="' + c.id + '">删除</button></td>';
    tbody.append(tr);
  });
  tb.append(tbody);
  card.append(tb);
  card.append(el('div', {cls:'row-actions'},
    el('button', {cls:'primary', onclick: saveCases}, '💾 保存用例（启停 / 条数）')));
  m.append(card);

  const addCard = el('div', {cls:'card'});
  addCard.append(el('h2', {}, '➕ 添加测试用例'));
  addCard.append(el('div', {cls:'grid2', html:
    '<div class="field"><label>数据集</label><select id="nc-dataset">'
      + '<option value="random">random</option><option value="gsm8k">gsm8k</option></select></div>'
    + '<div class="field"><label>输入长度</label><input type="text" id="nc-in" placeholder="如 1k / 64k / 1000k"></div>'
    + '<div class="field"><label>输出长度</label><input type="text" id="nc-out" placeholder="如 1k"></div>'
    + '<div class="field"><label>缓存命中率</label><input type="text" id="nc-hit" placeholder="0 / 0.3 / 0.9"></div>'
    + '<div class="field"><label>前缀数量</label><input type="number" id="nc-pnum" value="1"></div>'
    + '<div class="field"><label>TTFT SLA (ms)</label><input type="number" id="nc-ttft" value="10000"></div>'
    + '<div class="field"><label>TPOT SLA (ms)</label><input type="number" id="nc-tpot" value="50"></div>'
    + '<div class="field"><label>数据集条数（gsm8k）</label><input type="number" id="nc-num" placeholder="默认 1000"></div>'}));
  addCard.append(el('div', {cls:'row-actions'},
    el('button', {cls:'primary', onclick: addCase}, '添加用例')));
  m.append(addCard);

  const bc = document.getElementById('badge-cases'); if (bc) bc.textContent = cases.length;
}

async function saveCases() {
  const rows = document.querySelectorAll('tbody tr[data-id]');
  const payload = {cases: []};
  rows.forEach(tr => {
    const numInp = tr.querySelector('.dsnum');
    payload.cases.push({id: tr.dataset.id, enabled: tr.querySelector('.en').checked,
                        dataset_num: numInp ? numInp.value : null});
  });
  const r = await api('/api/cases', {method:'POST', body: JSON.stringify(payload)});
  toast(r.ok ? '用例已保存' : ('保存失败: ' + (r.error||'')));
  if (r.ok) renderCases();
}

async function addCase() {
  const raw = [$('#nc-dataset').value, $('#nc-in').value, $('#nc-out').value,
    ($('#nc-hit').value||'0'), ($('#nc-pnum').value||'1'), $('#nc-ttft').value, $('#nc-tpot').value].join(', ');
  const r = await api('/api/cases/add', {method:'POST', body: JSON.stringify({raw, dataset_num: $('#nc-num').value || null})});
  toast(r.ok ? ('用例已添加: ' + r.case.id) : ('失败: ' + (r.error||'')));
  if (r.ok) renderCases();
}
async function delCase(id) {
  if (!confirm('删除用例 ' + id + ' ?')) return;
  await api('/api/cases/delete', {method:'POST', body: JSON.stringify({id})});
  toast('已删除'); renderCases();
}
async function genCase(id) {
  await api('/api/datasets/generate', {method:'POST', body: JSON.stringify({case_ids:[id]})});
  toast('已开始生成数据集: ' + id);
  setTimeout(renderCases, 1500);
}
async function detectDatasets() {
  const r = await api('/api/datasets/generate', {method:'POST', body: JSON.stringify({})});
  toast('已检测：' + (r.count||0) + ' 个未生成的数据集开始生成');
  setTimeout(renderCases, 1500);
}
async function genDatasets(force) {
  const r = await api('/api/datasets/generate', {method:'POST', body: JSON.stringify({force})});
  toast((force?'强制重新生成 ':'生成 ') + (r.count||0) + ' 个数据集');
  setTimeout(renderCases, 1500);
}

/* 用例表内的「生成」「删除」用事件委托 */
document.addEventListener('click', e => {
  const g = e.target.closest && e.target.closest('[data-gen]');
  if (g) { genCase(g.dataset.gen); return; }
  const d = e.target.closest && e.target.closest('[data-del]');
  if (d && d.tagName === 'BUTTON') { delCase(d.dataset.del); return; }
});

/* ============================ 测试工程视图 ============================ */
async function renderProjects() {
  if (CURRENT_PROJECT) return renderProjectDetail(CURRENT_PROJECT);
  const {projects} = await api('/api/projects');
  const m = $('#main'); m.innerHTML = '';
  m.append(el('h1', {}, '测试工程'));
  m.append(el('div', {cls:'sub'}, '一个工程 = 一组要测试的用例；打开工程可启动/终止其测试任务，并查看每个用例的性能结果与日志'));

  const bar = el('div', {cls:'toolbar'});
  bar.append(el('button', {cls:'primary', onclick: newProject}, '➕ 新建测试工程'));
  bar.append(el('span', {cls:'spacer'}));
  bar.append(el('span', {cls:'muted'}, el('a', {href:'#', onclick:(e)=>{e.preventDefault();renderProjects()}}, '刷新')));
  m.append(bar);

  if (!projects.length) {
    m.append(el('div', {cls:'card'}, el('div', {cls:'muted'}, '还没有测试工程，点「新建测试工程」创建（默认纳入所有启用用例）')));
  } else {
    const grid = el('div', {cls:'proj-grid'});
    projects.forEach(p => {
      const total = p.case_count || 0;
      const pct = total ? Math.round((p.done||0)/total*100) : 0;
      const card = el('div', {cls:'proj-card'});
      card.append(el('h3', {}, '📦 ' + p.name));
      card.append(el('div', {cls:'meta'},
        '用例 ' + total + ' · 已完成 ' + (p.done||0) + ' · 进行/排队 ' + (p.running||0) + ' · ' + (p.created||'')));
      card.append(el('div', {cls:'bar', html:'<div style="width:'+pct+'%"></div>'}));
      const ops = el('div', {cls:'row-actions'});
      ops.append(el('button', {cls:'small', onclick:()=>openProject(p.id)}, '打开'));
      ops.append(el('button', {cls:'small primary', onclick:()=>runProject(p.id)}, '▶ 启动'));
      ops.append(el('button', {cls:'small danger', onclick:()=>stopProject(p.id)}, '■ 终止'));
      ops.append(el('button', {cls:'small danger', onclick:()=>delProject(p.id)}, '删除'));
      card.append(ops);
      grid.append(card);
    });
    m.append(grid);
  }
  const bp = document.getElementById('badge-projects'); if (bp) bp.textContent = projects.length;
}

async function newProject() {
  const {cases} = await api('/api/cases');
  const nEn = cases.filter(c => c.enabled !== false).length;
  const name = prompt('测试工程名称（默认纳入 ' + nEn + ' 个启用用例）：', '工程' + new Date().toLocaleTimeString());
  if (name === null) return;
  const r = await api('/api/projects', {method:'POST', body: JSON.stringify({name})});
  if (r.ok) { toast('已创建工程'); renderProjects(); }
  else toast('创建失败: ' + (r.error||''));
}
async function delProject(id) {
  if (!confirm('删除该测试工程？（不影响已生成的结果）')) return;
  await api('/api/projects/delete', {method:'POST', body: JSON.stringify({id})});
  toast('已删除'); renderProjects();
}
async function runProject(id) {
  const r = await api('/api/projects/'+id+'/run', {method:'POST', body: JSON.stringify({})});
  toast(r.ok ? ('已启动 ' + (r.queued||[]).length + ' 个用例') : ('启动失败: ' + (r.error||'')));
}
async function stopProject(id) {
  await api('/api/projects/'+id+'/stop', {method:'POST', body: '{}'});
  toast('已请求终止'); setTimeout(renderProjects, 500);
}
async function openProject(id) { CURRENT_PROJECT = id; renderProjectDetail(id); }

async function renderProjectDetail(pid) {
  const d = await api('/api/projects/'+pid);
  if (d.ok === false) { CURRENT_PROJECT = null; return renderProjects(); }
  const m = $('#main'); m.innerHTML = '';
  m.append(el('span', {cls:'back', onclick:()=>{CURRENT_PROJECT=null;renderProjects();}}, '← 返回工程列表'));
  m.append(el('h1', {}, '📦 ' + d.project.name));
  m.append(el('div', {cls:'sub'}, '工程 ID: ' + pid + ' · 用例 ' + d.cases.length + ' · 创建 ' + (d.project.created||'')));

  const bar = el('div', {cls:'toolbar'});
  bar.append(el('button', {cls:'primary', onclick:()=>runProject(pid).then(()=>setTimeout(()=>renderProjectDetail(pid),600))}, '▶ 启动全部用例'));
  bar.append(el('button', {cls:'danger', onclick:()=>stopProject(pid).then(()=>setTimeout(()=>renderProjectDetail(pid),600))}, '■ 终止'));
  bar.append(el('span', {cls:'spacer'}));
  bar.append(el('span', {cls:'muted'}, el('a', {href:'#', onclick:(e)=>{e.preventDefault();renderProjectDetail(pid)}}, '刷新')));
  m.append(bar);

  const card = el('div', {cls:'card'});
  const tb = el('table');
  tb.innerHTML = '<thead><tr><th>状态</th><th>用例 ID</th><th>数据集</th><th>输入/输出</th>'
    + '<th>命中</th><th>SLA</th><th>开始</th><th>结束</th><th>操作</th></tr></thead>';
  const tbody = el('tbody');
  d.cases.forEach(c => {
    const tr = el('tr');
    tr.innerHTML =
      '<td>' + pill(c.status) + '</td>'
      + '<td><code>' + c.case_id + '</code></td>'
      + '<td>' + c.dataset + '</td>'
      + '<td>' + kfmt(c.input_len) + ' / ' + kfmt(c.output_len) + '</td>'
      + '<td>' + hitfmt(c.hit_rate) + '</td>'
      + '<td>TTFT≤' + c.ttft_sla_ms + 'ms TPOT≤' + c.tpot_sla_ms + 'ms</td>'
      + '<td class="muted">' + (c.started||'-') + '</td>'
      + '<td class="muted">' + (c.finished||'-') + '</td>'
      + '<td></td>';
    const op = tr.lastElementChild;
    op.append(el('button', {cls:'small', onclick:()=>openCase(pid,c.case_id)}, '查看结果'));
    op.append(el('button', {cls:'small', onclick:()=>runOne(pid,c.case_id)}, '运行'));
    if (c.error) op.append(el('span', {cls:'muted', style:'margin-left:6px'}, '⚠ ' + c.error));
    tbody.append(tr);
  });
  tb.append(tbody);
  card.append(tb);
  m.append(card);
}

async function runOne(pid, cid) {
  const r = await api('/api/projects/'+pid+'/run', {method:'POST', body: JSON.stringify({case_ids:[cid]})});
  toast(r.ok ? ('已启动: ' + cid) : ('失败: ' + (r.error||'')));
  setTimeout(()=>renderProjectDetail(pid), 600);
}

async function openCase(pid, cid) {
  const d = await api('/api/projects/'+pid+'/case/'+cid);
  $('#dlg-title').textContent = '用例 ' + cid;
  const body = $('#dlg-body'); body.innerHTML = '';

  const kv = el('div', {cls:'kv'});
  kv.append(el('div', {cls:'k'}, '状态'), el('div', {cls:'v', html: pill(d.task.status||'not_started')}));
  kv.append(el('div', {cls:'k'}, '结果目录'), el('div', {cls:'v', html:'<code>' + (d.result_dir||'-') + '</code>'}));
  kv.append(el('div', {cls:'k'}, '汇总文件'),
    el('div', {cls:'v', html: d.summary_path ? ('<code>' + d.summary_path + '</code>') : '<span class="muted">尚未生成</span>'}));
  const logDiv = el('div', {cls:'v'});
  if (d.log_path) {
    logDiv.innerHTML = '<code>' + d.log_path + '</code> ';
    const b = el('button', {cls:'small'}, '查看'); b.onclick = () => showLog(d.log_path); logDiv.append(b);
  } else logDiv.innerHTML = '<span class="muted">-</span>';
  kv.append(el('div', {cls:'k'}, '运行日志'), logDiv);
  body.append(kv);

  body.append(el('h3', {style:'font-size:13px'}, '性能结果（各并发达标情况）'));
  if (!d.rows || !d.rows.length) {
    body.append(el('div', {cls:'muted'}, '暂无结果数据（用例未完成或未产生结果）'));
  } else {
    const tb = el('table');
    tb.innerHTML = '<thead><tr><th>并发</th><th>TTFT(ms)</th><th>TPOT(ms)</th><th>延迟(s)</th>'
      + '<th>成功/总</th><th>输出tok/s</th><th>总tok/s</th></tr></thead>';
    const tb2 = el('tbody');
    d.rows.forEach(r => {
      if (r.error) { tb2.append(el('tr', {html:'<td colspan=7 class="muted">' + r.error + '</td>'})); return; }
      tb2.append(el('tr', {html:'<td>' + r.parallel + '</td>'
        + '<td>' + (r.ttft==null?'-':(+r.ttft).toFixed(0)) + '</td>'
        + '<td>' + (r.tpot==null?'-':(+r.tpot).toFixed(2)) + '</td>'
        + '<td>' + (r.latency==null?'-':(+r.latency).toFixed(1)) + '</td>'
        + '<td>' + (r.ok||0) + '/' + (r.total||0) + '</td>'
        + '<td>' + (r.out_tps==null?'-':(+r.out_tps).toFixed(1)) + '</td>'
        + '<td>' + (r.total_tps==null?'-':(+r.total_tps).toFixed(1)) + '</td>'}));
    });
    tb.append(tb2); body.append(tb);
  }
  if (d.per_concurrency_logs && d.per_concurrency_logs.length) {
    body.append(el('h3', {style:'font-size:13px;margin-top:16px'}, '分并发日志'));
    d.per_concurrency_logs.forEach(p => {
      const row = el('div');
      row.innerHTML = '<code>' + p + '</code> ';
      const b = el('button', {cls:'small'}, '查看'); b.onclick = () => showLog(p); row.append(b);
      body.append(row);
    });
  }
  $('#dlg').showModal();
}

async function showLog(path) {
  const r = await api('/api/log?path=' + encodeURIComponent(path));
  $('#dlg-title').textContent = '日志: ' + path.split('/').slice(-2).join('/');
  $('#dlg-body').innerHTML = '';
  $('#dlg-body').append(el('pre', {cls:'log'}, (r.lines||['(空)']).join('')));
  if (!$('#dlg').open) $('#dlg').showModal();
}

/* ============================ 导航 ============================ */
const RENDER = { config: renderConfig, cases: renderCases, projects: renderProjects };
async function go(view) {
  VIEW = view;
  if (view !== 'projects') CURRENT_PROJECT = null;
  document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('active', a.dataset.view === view));
  await RENDER[view]();
}
document.querySelectorAll('#nav a').forEach(a => a.onclick = () => go(a.dataset.view));

/* 自动刷新：测试工程详情页 5 秒刷新 */
setInterval(() => { if (VIEW === 'projects' && CURRENT_PROJECT) renderProjectDetail(CURRENT_PROJECT); }, 5000);

go('config');
</script>
</body>
</html>

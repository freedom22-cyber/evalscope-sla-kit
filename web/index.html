<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>evalscope 测试控制台</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0F172A; --card:#1B2336; --card-2:#151d2e;
    --fg:#F8FAFC; --fg-dim:#94A3B8; --fg-mute:#64748B;
    --primary:#1E293B; --secondary:#334155; --border:#475569;
    --accent:#22C55E; --accent-ink:#0F172A; --accent-2:#38BDF8;
    --destructive:#EF4444; --warn:#F59E0B;
    --glass:rgba(255,255,255,.045); --glass-line:rgba(255,255,255,.12);
    --radius:16px; --radius-sm:10px;
    --shadow:0 8px 32px -12px rgba(0,0,0,.6), 0 2px 8px -4px rgba(0,0,0,.4);
    --ease:cubic-bezier(.4,0,.2,1);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:"Fira Sans",-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
       background:var(--bg);color:var(--fg);font-size:14px;-webkit-font-smoothing:antialiased;
       background-image:
         radial-gradient(900px 500px at 12% -5%, rgba(56,189,248,.10), transparent 60%),
         radial-gradient(800px 480px at 100% 0%, rgba(34,197,94,.08), transparent 55%);}
  a{color:inherit}
  .mono{font-family:"Fira Code",Menlo,Consolas,monospace;font-variant-ligatures:none}
  .app{display:flex;min-height:100vh}

  /* ---------- sidebar (glass) ---------- */
  .sidebar{width:240px;flex:0 0 240px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;
           background:linear-gradient(180deg,rgba(21,29,46,.92),rgba(15,23,42,.92));
           backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
           border-right:1px solid var(--glass-line)}
  .brand{padding:22px 20px 18px}
  .brand .logo{display:flex;align-items:center;gap:11px;font-size:15px;font-weight:600;letter-spacing:.2px;color:#fff}
  .brand .logo .mark{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;
       background:linear-gradient(135deg,var(--accent),#16A34A);
       box-shadow:0 6px 18px -4px rgba(34,197,94,.55)}
  .brand .logo .mark svg{width:17px;height:17px;stroke:var(--accent-ink)}
  .brand small{display:block;color:var(--fg-mute);font-size:10.5px;margin-top:7px;letter-spacing:1.2px;text-transform:uppercase}
  .nav{padding:6px 12px;flex:1;display:flex;flex-direction:column;gap:3px}
  .nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;color:var(--fg-dim);text-decoration:none;
         cursor:pointer;border-radius:var(--radius-sm);font-size:13.5px;font-weight:500;
         transition:background .18s var(--ease),color .18s var(--ease);border:1px solid transparent}
  .nav a svg{width:17px;height:17px;stroke:currentColor;flex:0 0 17px}
  .nav a:hover{background:var(--glass);color:#fff}
  .nav a.active{background:linear-gradient(135deg,rgba(34,197,94,.16),rgba(56,189,248,.08));color:#fff;
       border-color:rgba(34,197,94,.3)}
  .nav a.active svg{stroke:var(--accent)}
  .nav a .badge{margin-left:auto;background:var(--glass);border:1px solid var(--glass-line);border-radius:20px;
       padding:1px 8px;font-size:10.5px;color:var(--fg-dim);min-width:20px;text-align:center}
  .nav a.active .badge{background:rgba(34,197,94,.25);color:#fff;border-color:transparent}
  .foot{padding:14px 20px;font-size:10.5px;color:var(--fg-mute);border-top:1px solid var(--glass-line);letter-spacing:.4px}

  /* ---------- main ---------- */
  .main{flex:1;padding:32px 40px;overflow:auto;max-width:100%}
  .page-head{margin-bottom:24px}
  h1{font-size:24px;margin:0 0 7px;font-weight:600;letter-spacing:-.01em;color:#fff}
  .sub{color:var(--fg-dim);font-size:12.5px;line-height:1.6;max-width:940px}

  .card{background:linear-gradient(180deg,rgba(27,35,54,.85),rgba(21,29,46,.7));
        border:1px solid var(--glass-line);border-radius:var(--radius);padding:24px 26px;margin-bottom:18px;
        box-shadow:var(--shadow);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  .card h2{font-size:14px;margin:0 0 18px;display:flex;align-items:center;gap:9px;font-weight:600;color:#fff}
  .card h2 svg{width:16px;height:16px;stroke:var(--accent)}
  .card h2 .hint{font-weight:400;color:var(--fg-mute);font-size:11.5px;margin-left:auto;text-transform:none;letter-spacing:0}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px 24px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 24px}
  .field{display:flex;flex-direction:column;gap:7px;margin-bottom:8px}
  .field label{font-size:12px;color:var(--fg-dim);font-weight:500}
  .field input[type=text],.field input[type=number],.field select{
      padding:10px 13px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px;outline:none;
      background:rgba(15,23,42,.6);color:var(--fg);transition:border .18s var(--ease),box-shadow .18s var(--ease);width:100%;
      font-family:inherit}
  .field input:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(34,197,94,.18);background:rgba(15,23,42,.9)}
  .field .hint{font-size:11px;color:var(--fg-mute)}
  .switch{display:flex;align-items:center;gap:10px;padding-top:3px}
  .switch input{width:16px;height:16px;accent-color:var(--accent);cursor:pointer}

  button{padding:9px 16px;border:1px solid var(--glass-line);background:var(--glass);border-radius:var(--radius-sm);
         font-size:13px;cursor:pointer;color:#e2e8f0;font-family:inherit;font-weight:500;
         transition:background .18s var(--ease),border .18s var(--ease),transform .08s var(--ease),box-shadow .18s var(--ease);
         display:inline-flex;align-items:center;gap:7px;backdrop-filter:blur(6px)}
  button svg{width:15px;height:15px;stroke:currentColor}
  button:hover{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.22)}
  button:active{transform:translateY(1px)}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  button.primary{background:linear-gradient(135deg,var(--accent),#16A34A);border-color:transparent;color:var(--accent-ink);
       font-weight:600;box-shadow:0 6px 20px -6px rgba(34,197,94,.6)}
  button.primary:hover{background:linear-gradient(135deg,#2ee06a,#18b352)}
  button.danger{color:#fca5a5;border-color:rgba(239,68,68,.35)}
  button.danger:hover{background:rgba(239,68,68,.14)}
  button.small{padding:5px 11px;font-size:12px;border-radius:8px}
  button.small svg{width:13px;height:13px}
  button:disabled{opacity:.35;cursor:not-allowed;box-shadow:none;transform:none}
  button:disabled:hover{background:var(--glass);border-color:var(--glass-line)}
  .row-actions{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}

  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{text-align:left;padding:11px 13px;border-bottom:1px solid rgba(71,85,105,.35)}
  th{color:var(--fg-mute);font-weight:600;background:rgba(15,23,42,.4);font-size:10.5px;
     text-transform:uppercase;letter-spacing:.6px;position:sticky;top:0;backdrop-filter:blur(8px)}
  tbody tr{transition:background .14s var(--ease)}
  tbody tr:hover td{background:rgba(255,255,255,.03)}
  code{background:rgba(15,23,42,.7);border:1px solid rgba(71,85,105,.3);padding:1.5px 7px;border-radius:6px;
       font-size:11.5px;color:#7dd3fc;font-family:"Fira Code",Menlo,Consolas,monospace}
  .muted{color:var(--fg-mute)}

  .pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:20px;
        font-size:11px;font-weight:600;border:1px solid transparent}
  .pill:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.9}
  .pill.done{background:rgba(34,197,94,.16);color:#4ade80;border-color:rgba(34,197,94,.3)}
  .pill.running{background:rgba(56,189,248,.16);color:#7dd3fc;border-color:rgba(56,189,248,.3)}
  .pill.pending{background:rgba(148,163,184,.14);color:#cbd5e1}
  .pill.error{background:rgba(239,68,68,.16);color:#fca5a5;border-color:rgba(239,68,68,.3)}
  .pill.not_started{background:rgba(148,163,184,.1);color:var(--fg-mute)}
  .pill.stopped,.pill.interrupted{background:rgba(245,158,11,.16);color:#fcd34d;border-color:rgba(245,158,11,.3)}

  .toast{position:fixed;right:26px;bottom:26px;background:rgba(21,29,46,.96);color:#fff;padding:13px 19px;
         border-radius:12px;font-size:13px;opacity:0;transform:translateY(10px);border:1px solid var(--glass-line);
         transition:opacity .25s var(--ease),transform .25s var(--ease);z-index:200;
         box-shadow:0 16px 40px -10px rgba(0,0,0,.6);max-width:440px;backdrop-filter:blur(12px)}
  .toast.show{opacity:1;transform:none}

  .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:20px;flex-wrap:wrap}
  .toolbar .spacer{flex:1}

  pre.log{background:rgba(9,14,26,.92);color:#cbd5e1;padding:16px;border-radius:12px;max-height:70vh;
          overflow:auto;font-size:12px;line-height:1.6;white-space:pre-wrap;border:1px solid var(--glass-line);
          font-family:"Fira Code",Menlo,Consolas,monospace}

  dialog{border:1px solid var(--glass-line);border-radius:18px;padding:0;width:min(1100px,96vw);max-height:94vh;
         background:linear-gradient(180deg,#1B2336,#141c2d);color:var(--fg);
         box-shadow:0 40px 90px -24px rgba(0,0,0,.75)}
  dialog::backdrop{background:rgba(9,14,26,.7);backdrop-filter:blur(4px)}
  .dlg-head{padding:19px 24px;border-bottom:1px solid var(--glass-line);display:flex;align-items:center;gap:12px}
  .dlg-head h3{margin:0;font-size:16px;flex:1;font-weight:600;color:#fff}
  .dlg-body{padding:22px 24px;overflow:auto;max-height:76vh}
  .kv{display:grid;grid-template-columns:130px 1fr;gap:9px 14px;font-size:12.5px;margin-bottom:18px}
  .kv .k{color:var(--fg-mute)}
  .kv .v{color:var(--fg);word-break:break-all}

  .proj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
  .proj-card{border:1px solid var(--glass-line);border-radius:var(--radius);padding:20px;
             background:linear-gradient(180deg,rgba(27,35,54,.8),rgba(21,29,46,.65));box-shadow:var(--shadow);
             transition:box-shadow .22s var(--ease),transform .12s var(--ease),border-color .22s var(--ease)}
  .proj-card:hover{box-shadow:0 16px 40px -12px rgba(0,0,0,.65);border-color:rgba(34,197,94,.28);transform:translateY(-2px)}
  .proj-card h3{margin:0 0 8px;font-size:15px;font-weight:600;color:#fff;display:flex;align-items:center;gap:8px}
  .proj-card h3 svg{width:16px;height:16px;stroke:var(--accent)}
  .proj-card .meta{font-size:12px;color:var(--fg-dim);margin-bottom:13px}
  .proj-card .bar{height:7px;border-radius:4px;background:rgba(15,23,42,.7);overflow:hidden;margin:10px 0 15px}
  .proj-card .bar>div{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));
       border-radius:4px;transition:width .5s var(--ease)}
  .back{font-size:13px;color:var(--accent-2);cursor:pointer;margin-bottom:16px;display:inline-flex;
        align-items:center;gap:6px;font-weight:500;transition:color .15s var(--ease)}
  .back svg{width:15px;height:15px;stroke:currentColor}
  .back:hover{color:#7dd3fc}

  /* charts */
  .chart-row{display:flex;gap:18px;margin:16px 0;flex-wrap:wrap}
  .chart-box{flex:1;min-width:280px;background:rgba(15,23,42,.5);border:1px solid var(--glass-line);
             border-radius:14px;padding:16px}
  .chart-box h4{font-size:12px;color:var(--fg-dim);margin:0 0 10px;font-weight:600}
  .chart-svg{width:100%;height:155px;display:block}
  .sla-pass{background:rgba(34,197,94,.07)!important}
  .sla-fail{background:rgba(239,68,68,.07)!important}
  .summary-bar{display:flex;gap:14px;margin:16px 0;flex-wrap:wrap}
  .summary-stat{background:rgba(15,23,42,.5);border:1px solid var(--glass-line);border-radius:14px;padding:14px 20px;
       text-align:center;min-width:108px;flex:1}
  .summary-stat .val{font-size:24px;font-weight:700;color:#fff;letter-spacing:-.02em;font-family:"Fira Code",monospace}
  .summary-stat .lbl{font-size:11px;color:var(--fg-mute);margin-top:4px}
  .summary-stat.pass .val{color:#4ade80}
  .summary-stat.fail .val{color:#fca5a5}
  .elapsed{font-size:11px;color:var(--accent-2);font-weight:600;font-family:"Fira Code",monospace}

  .empty{text-align:center;padding:60px 20px;color:var(--fg-mute)}
  .empty .big{width:52px;height:52px;margin:0 auto 16px;opacity:.4}
  .empty .big svg{width:52px;height:52px;stroke:currentColor}

  /* markdown */
  .md{font-size:13px;line-height:1.7;color:#e2e8f0}
  .md h1{font-size:20px;margin:6px 0 16px;color:#fff}
  .md h2{font-size:15px;margin:22px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--glass-line);color:#fff}
  .md table{margin:12px 0;font-size:12px}
  .md code{font-size:11.5px}
  .md ul{margin:8px 0;padding-left:20px}
  .md li{margin:4px 0}
  .md .md-pass{color:#4ade80;font-weight:700}
  .md .md-fail{color:#fca5a5;font-weight:700}
  .md .md-warn{color:#fcd34d;font-weight:700}
  .md .md-skip{color:var(--fg-mute);font-weight:600}

  .skeleton{height:16px;border-radius:6px;background:linear-gradient(90deg,rgba(255,255,255,.05),rgba(255,255,255,.12),rgba(255,255,255,.05));
       background-size:200% 100%;animation:sk 1.4s ease-in-out infinite}
  @keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms!important;transition-duration:.001ms!important}
  }
  @media(max-width:900px){
    .grid2,.grid3{grid-template-columns:1fr}
    .sidebar{width:68px;flex:0 0 68px}
    .brand .logo span:not(.mark),.brand small,.nav a span:not(.ico):not(.badge),.foot{display:none}
    .nav a{justify-content:center}.main{padding:20px}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo"><span class="mark" id="brand-icon"></span><span>evalscope 控制台</span></div>
      <small>Serving Test Console</small>
    </div>
    <nav class="nav" id="nav">
      <a data-view="config" class="active"><span class="ico" data-ic="settings"></span><span>配置项</span></a>
      <a data-view="cases"><span class="ico" data-ic="flask"></span><span>测试用例</span><span class="badge" id="badge-cases">-</span></a>
      <a data-view="projects"><span class="ico" data-ic="package"></span><span>测试工程</span><span class="badge" id="badge-projects">-</span></a>
      <a data-view="functional"><span class="ico" data-ic="compass"></span><span>功能测试</span></a>
      <a data-view="accuracy"><span class="ico" data-ic="target"></span><span>精度测试</span></a>
    </nav>
    <div class="foot">FastAPI · 端口 8300</div>
  </aside>
  <main class="main" id="main"></main>
</div>
<div class="toast" id="toast"></div>
<dialog id="dlg"><div class="dlg-head"><h3 id="dlg-title">详情</h3>
  <button class="small" onclick="document.getElementById('dlg').close()">关闭</button></div>
  <div class="dlg-body" id="dlg-body"></div></dialog>

<script>
/* ---------- Lucide-style inline SVG icons ---------- */
const ICONS = {
  settings:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>',
  flask:'<path d="M9 3h6"/><path d="M10 3v6.5L4.5 18a2 2 0 0 0 1.7 3h11.6a2 2 0 0 0 1.7-3L14 9.5V3"/><path d="M6.5 15h11"/>',
  package:'<path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/>',
  compass:'<circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/>',
  target:'<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>',
  bolt:'<path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/>',
  play:'<polygon points="6 3 20 12 6 21 6 3"/>',
  stop:'<rect x="5" y="5" width="14" height="14" rx="2"/>',
  refresh:'<path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/>',
  download:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polygon points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>',
  search:'<circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>',
  plus:'<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
  save:'<path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/>',
  plug:'<path d="M12 22v-5"/><path d="M9 8V2"/><path d="M15 8V2"/><path d="M18 8v3a6 6 0 0 1-12 0V8z"/>',
  trash:'<polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
  doc:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>',
  eye:'<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/>',
  list:'<line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>',
  arrowLeft:'<line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>',
  check:'<polyline points="20 6 9 17 4 12"/>'
};
function icon(name, cls){
  const p = ICONS[name] || ICONS.bolt;
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"'+(cls?' class="'+cls+'"':'')+'>'+p+'</svg>';
}
function iconEl(name, cls){ const s=document.createElement('span'); s.style.display='inline-flex'; s.innerHTML=icon(name,cls); return s.firstChild; }
/* fill nav icons */
document.getElementById('brand-icon').innerHTML=icon('bolt');
document.querySelectorAll('.nav .ico').forEach(sp=>{ sp.innerHTML=icon(sp.dataset.ic); });

const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const el = (t, a={}, ...kids) => {
  const e = document.createElement(t);
  for (const k in a) {
    if (k === 'html') e.innerHTML = a[k];
    else if (k === 'cls') e.className = a[k];
    else if (k === 'style') e.setAttribute('style', a[k]);
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), a[k]);
    else e.setAttribute(k, a[k]);
  }
  for (const k of kids) e.append(k);
  return e;
};

  not_started:'未开始', stopped:'已停止', interrupted:'已中断' };

/* ---- SVG bar chart (dark) ---- */
function barChart(data, opts={}){
  const {w=320,h=155,color='#38BDF8',threshold=null,labelFmt=v=>v} = opts;
  if(!data.length) return '<span class="muted">无数据</span>';
  const vals = data.map(d=>d.val).filter(v=>v!=null&&v>=0);
  if(!vals.length) return '<span class="muted">无数据</span>';
  const maxV = Math.max(...vals, threshold||0)*1.18 || 1;
  const barW = Math.max(8,(w-34)/data.length-8);
  const x0=32,y0=h-22;
  let bars='';
  data.forEach((d,i)=>{
    const v=d.val; if(v==null) return;
    const x=x0+i*(barW+8);
    const bh=maxV>0?(v/maxV)*(y0-14):0;
    const y=y0-bh;
    const over = threshold && v>threshold;
    const fill = (d.fail||over)?'#EF4444':color;
    bars += `<rect x="${x}" y="${y}" width="${barW}" height="${bh}" fill="${fill}" rx="3"/>`;
    bars += `<text x="${x+barW/2}" y="${y0+15}" text-anchor="middle" font-size="10" fill="#64748B" font-family="Fira Code,monospace">${esc(d.label)}</text>`;
    bars += `<text x="${x+barW/2}" y="${y-5}" text-anchor="middle" font-size="9.5" fill="#94A3B8" font-family="Fira Code,monospace">${labelFmt(v)}</text>`;
  });
  let thLine='';
  if(threshold && maxV>0){
    const ty=y0-(threshold/maxV)*(y0-14);
    thLine=`<line x1="${x0}" y1="${ty}" x2="${w-8}" y2="${ty}" stroke="#EF4444" stroke-dasharray="5,4" stroke-width="1.3"/>`
      +`<text x="${w-8}" y="${ty-4}" text-anchor="end" font-size="9.5" fill="#fca5a5" font-family="Fira Code,monospace">SLA ${labelFmt(threshold)}</text>`;
  }
  return `<svg class="chart-svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">${bars}${thLine}</svg>`;
}
function exportCSV(rows, filename){
  if(!rows||!rows.length) return;
  const cols=Object.keys(rows[0]);
  const csv=[cols.join(',')].concat(rows.map(r=>cols.map(c=>{
    const v=r[c]; return v==null?'':/[\",\n]/.test(String(v))?'"'+String(v).replace(/"/g,'""')+'"':v;
  }).join(','))).join('\n');
  const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename;
  a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
function elapsed(started, finished){
  if(!started) return '';
  const end=finished?new Date(finished):new Date();
  const s=Math.round((end-new Date(started))/1000);
  if(s<60) return s+'s';
  return Math.floor(s/60)+'m'+(s%60)+'s';
}
/* minimal markdown renderer */
function renderMD(md){
  const lines = String(md||'').split('\n');
  let html='', inTable=false, inList=false;
  const closeAll=()=>{ if(inTable){html+='</tbody></table>';inTable=false;} if(inList){html+='</ul>';inList=false;} };
  for(let i=0;i<lines.length;i++){
    let ln=lines[i];
    if(/^\s*\|.*\|\s*$/.test(ln)){
      const cells=ln.trim().replace(/^\||\|$/g,'').split('|').map(s=>s.trim());
      if(i+1<lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i+1])){
        closeAll(); html+='<table><thead><tr>'+cells.map(c=>'<th>'+mdInline(c)+'</th>').join('')+'</tr></thead><tbody>'; inTable=true; i++; continue;
      }
      if(inTable){ html+='<tr>'+cells.map(c=>'<td>'+mdInline(c)+'</td>').join('')+'</tr>'; continue; }
    } else if(inTable){ closeAll(); }
    let m;
    if((m=ln.match(/^(#{1,6})\s+(.*)$/))){ closeAll(); const lv=m[1].length; html+=`<h${lv}>`+mdInline(m[2])+`</h${lv}>`; continue; }
    if((m=ln.match(/^\s*[-*]\s+(.*)$/))){ if(!inList){closeAll();html+='<ul>';inList=true;} html+='<li>'+mdInline(m[1])+'</li>'; continue; }
    else if(inList){ closeAll(); }
    if(!ln.trim()){ closeAll(); continue; }
    html+='<p>'+mdInline(ln)+'</p>';
  }
  closeAll();
  return '<div class="md">'+html+'</div>';
}
function mdInline(s){
  s=esc(s);
  s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
  s=s.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
  s=s.replace(/\b(PASS)\b/g,'<span class="md-pass">$1</span>');
  s=s.replace(/\b(FAIL)\b/g,'<span class="md-fail">$1</span>');
  s=s.replace(/\b(WARN)\b/g,'<span class="md-warn">$1</span>');
  s=s.replace(/\b(SKIP)\b/g,'<span class="md-skip">$1</span>');
  return s;
}

function fmt(v,d){ return v==null?'-':(+v).toFixed(d); }
function bestOf(d){
  const rows=(d.rows||[]).filter(r=>!r.error);
  const ttftSLA=d.ttft_sla_ms||null, tpotSLA=d.tpot_sla_ms||null;
  const pass=r=>(r.ttft==null||r.ttft<=ttftSLA)&&(r.tpot==null||r.tpot<=tpotSLA)&&(r.ok||0)==(r.total||0);
  const passing=rows.filter(pass);
  const maxConc=passing.length?Math.max(...passing.map(r=>r.parallel)):0;
  const best=passing.find(r=>r.parallel===maxConc)||null;
  const peakTps=passing.length?Math.max(...passing.map(r=>r.out_tps||0)):null;
  return {rows,maxConc,best,peakTps,ttftSLA,tpotSLA};
}

let _LOG_POLL = null;
async function showLog(path){
  if (_LOG_POLL) { clearInterval(_LOG_POLL); _LOG_POLL = null; }
  $('#dlg-title').textContent='日志: '+path.split('/').slice(-2).join('/');
  const body=$('#dlg-body'); body.innerHTML='';
  /* 工具栏：行数 + 停止轮询 */
  const tb=el('div',{style:'display:flex;align-items:center;gap:10px;margin-bottom:10px'});
  const info=el('span',{cls:'muted',style:'font-size:12px'},'加载中…');
  const stopBtn=el('button',{cls:'small'},'⏸ 停止刷新'); stopBtn.disabled=true;
  tb.append(info, el('span',{style:'flex:1'}), stopBtn);
  body.append(tb);
  const pre=el('pre',{cls:'log'},'');
  body.append(pre);
  if(!$('#dlg').open) $('#dlg').showModal();
  let offset=0, total=0;
  async function poll(){
    const r=await api('/api/log?path='+encodeURIComponent(path)+'&offset='+offset);
    if(!r.ok){ info.textContent=r.error||'读取失败'; return; }
    if(r.lines && r.lines.length){
      pre.textContent += r.lines.join('');
      offset += r.lines.length;
      total = r.total;
      pre.scrollTop = pre.scrollHeight;
    }
    info.textContent = total+' 行' + (offset>=total?' (已全部加载)':' (实时跟踪中…)');
    stopBtn.disabled=false;
  }
  await poll();
  _LOG_POLL = setInterval(poll, 2000);
  stopBtn.onclick = ()=>{
    if(_LOG_POLL){ clearInterval(_LOG_POLL); _LOG_POLL=null; stopBtn.textContent='▶ 恢复刷新'; }
    else { _LOG_POLL=setInterval(poll,2000); stopBtn.textContent='⏸ 停止刷新'; }
  };
  /* dialog 关闭时清理 */
  $('#dlg').onclose = ()=>{ if(_LOG_POLL){clearInterval(_LOG_POLL);_LOG_POLL=null;} };
}

    el('span',{cls:'hint'}, '留空使用数据集组自身配置')));
  const rg=el('div',{cls:'grid3'});
  rg.append(field('样本上限 (--limit)','acc_limit','','冒烟用，每组只评 N 条；留空=全量','number'));
  rg.append(field('pass@k 覆盖 (--k)','acc_k','','留空=用组内 k；填 4 即 --repeats 4','number'));
  rg.append(field('只跑指定 tag (--only)','acc_only','','逗号分隔，如 all5；留空=全部启用组'));
  runCard.append(rg);
  runCard.append(el('div',{cls:'row-actions'},
    btn('用这些参数运行','play','primary',()=>runAccuracy(true))));
  m.append(runCard);

  m.append(el('div',{id:'acc-status-card'}));
  m.append(el('div',{id:'acc-report-card'}));
  await refreshAccStatus();
}

async function renderAccConfig(){
  const card=$('#acc-cfg-card'); if(!card) return;
  card.innerHTML='';
  const r=await api('/api/accuracy/config');
  ACC_GROUPS = (r.groups||[]).map(g=>({...g}));
  card.append(el('h2',{}, iconEl('target'), el('span',{},'数据集组'),
    el('span',{cls:'hint'}, (r.from_override?'来自页面配置':'来自 config.yaml')+' · '+ACC_GROUPS.length+' 组')));
  if(!ACC_GROUPS.length){
    card.append(el('div',{cls:'empty'}, el('div',{cls:'big',html:icon('target')}), el('div',{},'暂无数据集组，点下方「添加数据集组」')));
  }else{
    const wrap=el('div',{style:'overflow:auto'});
    const tb=el('table');
    tb.innerHTML='<thead><tr><th>tag</th><th>数据集（空格分隔）</th><th>轮数</th><th>effort</th>'
      +'<th>max_tokens</th><th>batch</th><th>k</th><th>操作</th></tr></thead>';
    const tbody=el('tbody');
    ACC_GROUPS.forEach((g,i)=>{
      const tr=el('tr'); tr.dataset.gi=i;
      tr.innerHTML=
        '<td><input class="gi" data-f="tag" value="'+esc(g.tag||'')+'" style="width:90px"></td>'
        +'<td><input class="gi" data-f="datasets" value="'+esc((g.datasets||[]).join(' '))+'" style="width:220px"></td>'
        +'<td><input class="gi" data-f="rounds" type="number" value="'+(g.rounds||1)+'" style="width:60px"></td>'
        +'<td><input class="gi" data-f="effort" value="'+esc(g.effort||'max')+'" style="width:70px"></td>'
        +'<td><input class="gi" data-f="max_tokens" type="number" value="'+(g.max_tokens||131072)+'" style="width:90px"></td>'
        +'<td><input class="gi" data-f="batch_size" type="number" value="'+(g.batch_size||32)+'" style="width:60px"></td>'
        +'<td><input class="gi" data-f="k" type="number" value="'+(g.k||1)+'" style="width:50px"></td>'
        +'<td><button class="small danger" data-accdel="'+i+'">删除</button></td>';
      tbody.append(tr);
    });
    tb.append(tbody); wrap.append(tb); card.append(wrap);
  }
  const ops=el('div',{cls:'row-actions'});
  ops.append(btn('添加数据集组','plus','',addAccGroup));
  ops.append(btn('保存数据集组','save','primary',saveAccConfig));
  card.append(ops);
}
function collectAccGroups(){
  const rows=$$('#acc-cfg-card tbody tr[data-gi]');
  return rows.map(tr=>{
    const o={};
    $$('input.gi',tr).forEach(inp=>{
      const f=inp.dataset.f;
      o[f] = f==='datasets' ? inp.value.trim().split(/\s+/).filter(Boolean) : inp.value;
    });
    ['rounds','max_tokens','batch_size','k'].forEach(f=>o[f]=+o[f]||undefined);
    return o;
  }).filter(g=>g.tag && g.datasets && g.datasets.length);
}
async function addAccGroup(){
  ACC_GROUPS=collectAccGroups();
  ACC_GROUPS.push({tag:'',datasets:[],rounds:1,effort:'max',max_tokens:131072,batch_size:32,k:1});
  redrawRows($('#acc-cfg-card'));
}
async function delAccGroup(i){
  ACC_GROUPS=collectAccGroups();
  ACC_GROUPS.splice(i,1);
  redrawRows($('#acc-cfg-card'));
}
function redrawRows(card){
  if(!card) return;
  const old=card.querySelector('table'); if(!old) return;
  const wrap=old.parentElement;
  wrap.innerHTML='';
  const tb=el('table');
  tb.innerHTML='<thead><tr><th>tag</th><th>数据集（空格分隔）</th><th>轮数</th><th>effort</th>'
    +'<th>max_tokens</th><th>batch</th><th>k</th><th>操作</th></tr></thead>';
  const tbody=el('tbody');
  ACC_GROUPS.forEach((g,i)=>{
    const tr=el('tr'); tr.dataset.gi=i;
    tr.innerHTML=
      '<td><input class="gi" data-f="tag" value="'+esc(g.tag||'')+'" style="width:90px"></td>'
      +'<td><input class="gi" data-f="datasets" value="'+esc((g.datasets||[]).join(' '))+'" style="width:220px"></td>'
      +'<td><input class="gi" data-f="rounds" type="number" value="'+(g.rounds||1)+'" style="width:60px"></td>'
      +'<td><input class="gi" data-f="effort" value="'+esc(g.effort||'max')+'" style="width:70px"></td>'
      +'<td><input class="gi" data-f="max_tokens" type="number" value="'+(g.max_tokens||131072)+'" style="width:90px"></td>'
      +'<td><input class="gi" data-f="batch_size" type="number" value="'+(g.batch_size||32)+'" style="width:60px"></td>'
      +'<td><input class="gi" data-f="k" type="number" value="'+(g.k||1)+'" style="width:50px"></td>'
      +'<td><button class="small danger" data-accdel="'+i+'">删除</button></td>';
    tbody.append(tr);
  });
  tb.append(tbody); wrap.append(tb);
}
async function saveAccConfig(){
  const groups=collectAccGroups();
  if(!groups.length){ toast('至少保留一个有效数据集组'); return; }
  const r=await api('/api/accuracy/config',{method:'POST',body:JSON.stringify({groups})});
  toast(r.ok?('已保存 '+r.count+' 个数据集组'):('保存失败: '+(r.error||'')));
  if(r.ok) await renderAccConfig();
}
async function refreshAccStatus(){
  const st=await api('/api/accuracy/status');
  if(!$('#acc-status-card')) return;
  const running=st.status==='running';
  const rb=$('#acc-run-btn'); if(rb) rb.disabled=running;
  statusCard('acc-status-card', st, running);
  if(running){ setTimeout(async()=>{ await refreshAccStatus(); await loadAccReport(); },6000); }
  else { await loadAccReport(); }
}
async function loadAccReport(){
  const r=await api('/api/accuracy/report');
  reportCard('acc-report-card', r, 'target', '暂无精度结果，点上方「运行精度测试」开始');
}
async function runAccuracy(withParams){
  let body={};
  if(withParams){
    const lim=$('#cfg-acc_limit').value, k=$('#cfg-acc_k').value, only=$('#cfg-acc_only').value.trim();
    if(lim) body.limit=+lim;
    if(k) body.k=+k;
    if(only) body.only=only;
  }
  const r=await api('/api/accuracy/run',{method:'POST',body:JSON.stringify(body)});
  if(r.ok) toast('精度测试已启动'); else toast('启动失败: '+(r.error||''));
  await refreshAccStatus();
}
async function viewAccList(){
  const r=await api('/api/accuracy/list');
  $('#dlg-title').textContent='精度数据集组';
  $('#dlg-body').innerHTML='';
  $('#dlg-body').append(el('pre',{cls:'log'},(r.lines||['(空)']).join('\n')));
  $('#dlg').showModal();
}

/* ============================ 导航 ============================ */
const RENDER={ config:renderConfig, cases:renderCases, projects:renderProjects,
               functional:renderFunctional, accuracy:renderAccuracy };
async function go(view){
  VIEW=view;
  if(view!=='projects') CURRENT_PROJECT=null;
  $$('#nav a').forEach(a=>a.classList.toggle('active', a.dataset.view===view));
  await RENDER[view]();
}
$$('#nav a').forEach(a=>a.onclick=()=>go(a.dataset.view));
setInterval(()=>{ if(VIEW==='projects'&&CURRENT_PROJECT) renderProjectDetail(CURRENT_PROJECT); },5000);
setInterval(()=>{ if(VIEW==='cases'){ const g=document.querySelector('[data-gen][disabled]'); if(g) renderCases(); } },3000);
go('config');
</script>
</body>

# ============================================================================
# evalscope 摸高测试配置
# ----------------------------------------------------------------------------
# 使用方法:
#   1. 修改 service 段为被测服务地址/模型名/tokenizer 路径
#   2. 在 scenarios 段中注释/取消注释行来选择要跑的场景
#   3. bash run.sh            # 顺序跑所有启用场景（nohup 后台）
#      bash run.sh --dry-run  # 只打印命令不执行
#      python3 report.py      # 跑完后汇总所有场景结果为一张表
# ============================================================================

service:
  # 被测服务 OpenAI 兼容端点（chat completions 完整路径）
  # MaaS 网关：路径含应用 id（app id = 2f62fe2b-43ab-4780-bfc0-a35d55f779ad）
  url: http://113.46.2.168/v2/infer/2f62fe2b-43ab-4780-bfc0-a35d55f779ad/v1/chat/completions
  # 服务端 served model 名（必须与服务配置一致，否则 404/模型不存在）
  # GET <url 去掉 /v1/chat/completions>/v1/models 可查；当前服务暴露 glm5.3
  model: glm5.3
  # 被测模型 tokenizer 本地路径（token 计数/长度过滤/gsm8k 数据集生成用）
  # 对应权重 GLM-5.3-w4a4c8-mxfp4（W4A4 MXFP4 + W8A8 MXFP8，1M ctx）
  tokenizer_path: /home/hhc/model/GLM-5.3-w4a4c4-mxfp4-0902
  # 服务上下文上限（agentx 回放传 --max-context-length, 超长 trace 会先被过滤,
  # 避免打到服务端 400; 不设置则不传。glm5.3 端点 max_model_len=204800）
  max_context_length: 204800

request:
  # 是否在请求头中加 Host 参数（经过 LB/代理/网关按域名路由时需要）
  add_host_header: false
  # Host 头的值；留空 "" 表示自动取 url 中的主机名
  host_header: ""
  # 额外自定义请求头（可选），每行一个 "Key=Value"
  extra_headers: []
  #  - "Authorization=Bearer xxx"
  # API key（可选，设置后自动加 Authorization: Bearer <api_key>）
  # 网关不校验 token，沿用 sunzhi 约定填 EMPTY（evalscope --api-key 也需要非空）
  api_key: "EMPTY"

benchmark:
  # 摸高并发搜索区间 [lower, upper]
  sla_lower_bound: 1
  sla_upper_bound: 512
  # 每个候选并发跑几轮取平均
  sla_num_runs: 2
  # 每个候选并发的请求数 = 并发数 x number_multiplier
  number_multiplier: 2
  # 正式测试前的 warmup 请求数
  warmup_num: 10
  # 数据集生成 worker 进程数（0 = 按 CPU 自动；内存受限的客户端机器建议 1）
  num_workers: 0
  # 单场景时间预算（分钟）。>0 时到限终止该场景, 并按已完成的探测档
  # (results/<场景ID>/<时间戳>/<model>/sla_tuning/sla_parallel_N_run_M/benchmark_summary.json)
  # 计算 partial 结论: 最大达标并发是真实上限的下界。0 = 不限制
  time_budget_min: 0
  # 压测运行中健康探活间隔（秒）。>0 时定期 GET 服务的 /v1/models（连通性检查,
  # 任意 HTTP 状态码都算存活），连续失败时打告警。0 = 关闭
  health_check_interval_s: 60
  # 请求采样参数（原样透传给 evalscope --extra-args 的 JSON）
  # ignore_eos=true: 输出固定到 max_tokens，TPOT/吞吐才可比
  # thinking 模型必须带 chat_template_kwargs.thinking=false，否则思考 token
  # 拉高 TPOT 失真；非思考模型删掉 chat_template_kwargs 段即可
  extra_args:
    ignore_eos: true
    chat_template_kwargs:
      thinking: false

dataset:
  # gsm8k 数据集生成参数（tools/gen_dataset_only.py）
  # 每种 (input_len, repeat_rate) 组合只生成一次，之后按文件名复用
  gsm8k_number: 1000        # 每个数据集的样本条数（全局默认）
  # 按数据集覆盖条数（Web UI 数据集视图写入）；键格式 "<input_len>_<hit_rate>"
  # 优先级高于 gsm8k_number；相同 (input_len, hit_rate) 的场景共用同一数据集
  number_overrides: {}
  gsm8k_prefix_num: 1       # 前缀种类数（场景固定为 1）
  gsm8k_seed: 0             # 随机种子
  gsm8k_dp: 1               # DP 域数
  force_regenerate: false   # true = 文件名相同也强制重新生成

# ============================================================================
# 测试场景（固定清单，按需注释/取消注释）
# ----------------------------------------------------------------------------
# 每行一个场景，格式（逗号分隔，顺序固定）:
#   "dataset, input_len, output_len, cache_hit_rate, prefix_num, ttft_sla_ms, tpot_sla_ms [, dataset_num]"
#
#   dataset        : random | gsm8k
#   input_len      : 输入 token 数（k 简写 = x1024，如 1k=1024, 1000k=1024000）
#   output_len     : 输出 token 数（同上）
#   cache_hit_rate : 缓存命中率（random 固定 0；gsm8k: 0 / 0.3 / 0.9）
#   prefix_num     : 前缀数量（固定 1）
#   ttft_sla_ms    : avg TTFT SLA 上限（毫秒）
#   tpot_sla_ms    : avg TPOT SLA 上限（毫秒）
#   dataset_num    : （可选）数据集条数，仅 gsm8k 有效；不填 = 用 dataset.gsm8k_number 全局默认
#
# 注意:
#   - random 数据集由 evalscope 在线生成（0% 缓存命中，跨轮自动偏移防命中）
#   - gsm8k 数据集由 run.sh 自动生成+转格式（需要 tokenizer 与 torch/transformers）
#   - 数据集按文件名复用：相同 (input_len, hit_rate, dataset_num) 只生成一次
#   - 注释行 = 跳过该场景；取消注释 = 启用
#   - 批量预生成数据集: bash run.sh --gen-datasets
# ============================================================================
scenarios:
  # ---- random：短中长输入，TTFT<=10s / TPOT<=50ms ----
  - "random, 1k, 1k, 0, 1, 10000, 50"
  - "random, 1k, 8k, 0, 1, 10000, 50"
  - "random, 8k, 1k, 0, 1, 10000, 50"
  # ---- random：超长输出，TTFT<=3s / TPOT<=50ms ----
  - "random, 1k, 32k, 0, 1, 3000, 50"
  - "random, 1k, 64k, 0, 1, 3000, 50"
  # ---- gsm8k 0% 缓存命中，TTFT<=60s / TPOT<=50ms ----
  - "gsm8k, 16k, 1k, 0, 1, 60000, 50, 500"
  - "gsm8k, 32k, 1k, 0, 1, 60000, 50"
  - "gsm8k, 64k, 1k, 0, 1, 60000, 50"
  - "gsm8k, 75k, 1k, 0, 1, 60000, 50"
  - "gsm8k, 128k, 1k, 0, 1, 60000, 50"
  - "gsm8k, 256k, 1k, 0, 1, 60000, 50"
  - "gsm8k, 512k, 1k, 0, 1, 60000, 50"
  - "gsm8k, 1000k, 1k, 0, 1, 60000, 50"
  # ---- gsm8k 30% 缓存命中，TTFT<=30s / TPOT<=50ms ----
  - "gsm8k, 64k, 1k, 0.3, 1, 30000, 50"
  - "gsm8k, 75k, 1k, 0.3, 1, 30000, 50"
  - "gsm8k, 128k, 1k, 0.3, 1, 30000, 50"
  - "gsm8k, 256k, 1k, 0.3, 1, 30000, 50"
  - "gsm8k, 512k, 1k, 0.3, 1, 30000, 50"
  - "gsm8k, 1000k, 1k, 0.3, 1, 30000, 50"
  # ---- gsm8k 90% 缓存命中，TTFT<=10s / TPOT<=50ms ----
  - "gsm8k, 64k, 1k, 0.9, 1, 10000, 50"
  - "gsm8k, 75k, 1k, 0.9, 1, 10000, 50"
  - "gsm8k, 128k, 1k, 0.9, 1, 10000, 50"
  - "gsm8k, 256k, 1k, 0.9, 1, 10000, 50"
  - "gsm8k, 512k, 1k, 0.9, 1, 10000, 50"
  - "gsm8k, 1000k, 1k, 0.9, 1, 10000, 50"

# ============================================================================
# 精度测试（迁移自 sunzhi_sla_eval run208.sh cmd_accuracy, 通用化）
# ----------------------------------------------------------------------------
# 用法: bash run.sh --accuracy            # 后台跑所有启用数据集组
#       bash run.sh --accuracy -f         # 前台
#       python3 accuracy_runner.py --list / --dry-run / --only all5 / --report
# 数据集行格式（逗号分隔, 顺序固定）:
#   "tag, evalscope_datasets, rounds, effort, max_tokens, batch_size [, k]"
#   tag              : 数据集组名（结果目录 results/accuracy/<tag>_r<N>/）
#   evalscope_datasets: 传给 --datasets 的值（空格分隔多个, 如 "aime25 aime26"）
#   rounds           : 重复轮数（每轮独立 work-dir, 便于算均值/方差）
#   effort           : reasoning_effort（low/high/xhigh/max/none; 注意 "medium"
#                      在部分服务上是已知 400 缺陷, 见 sunzhi 仓 F-03）
#   max_tokens       : 生成上限
#   batch_size       : --eval-batch-size
#   k                :（可选）pass@k 的采样次数。默认 1 = 单次 mean 口径（不加
#                      --repeats）; k>1 时每题采样 k 次, evalscope 按
#                      aggregation=mean_and_pass_at_k 聚合, 结果同时给出
#                      mean 与 pass@1..pass@k, 请求量 x k, 结果目录为
#                      results/accuracy/<tag>_pass@k<k>_r<N>/（与 k=1 的结果隔开,
#                      且不同 k 各占一个目录, 互不覆盖）
# ============================================================================
accuracy:
  # evalscope 可执行文件（也可被环境变量 EVALSCOPE_BIN 覆盖, 与 performance/env.sh 同名约定）
  evalscope_bin: evalscope
  # 非空时运行中导出 http_proxy/https_proxy（evalscope 首次下载数据集需要外网;
  # 被测服务地址会自动加入 no_proxy）
  proxy: ""
  datasets:
    # 一条命令跑全部 5 个数据集（--datasets 后每个名字必须是独立 argv 元素,
    # runner 会把本字段按空格拆开逐个传; 拼成一个元素会被 evalscope 当成
    # 单个基准名报 Benchmark not found）
    # k=4: pass@k 口径（每题采样 4 次, 请求量 x4, 输出 mean + pass@1..pass@4）
    - "all5, gpqa_diamond aime25 aime26 gsm8k mmlu, 1, max, 131072, 32, 4"

# ============================================================================
# AgentX 智能体工作负载回放（agentx_runner.py, SemiAnalysis AgentX v1.0）
# ----------------------------------------------------------------------------
# 用 agentx-harness 回放公开的 Claude Code 会话 trace（393 个真实智能体
# 编码会话, 含多轮/子智能体/前缀复用/KV cache 命中模式）, 测真实智能体
# 工作负载下的性能（TTFT/吞吐/缓存命中）, 不是精度。
# 用法: bash run.sh --agentx           # 后台跑（日志 logs/agentx_*.log）
#       bash run.sh --agentx -f        # 前台
#       python3 agentx_runner.py --list / --dry-run / --only 256k
# 数据集变体（HuggingFace semianalysisai/cc-traces-weka-*）:
#   full  1M ctx, 135k 请求 | 256k  256k ctx, 68k 请求（推荐, 兼容小上下文）
# 本地裁剪语料（local:<目录>）: 先用 tools/curate_weka_traces.py 从 traces.jsonl
#   生成, 80 会话 x 8 轮 x ~65k 输入 x ~80% 缓存命中（glm5.3 实测 810 请求:
#   ISL p50 65.4k, 理论前缀命中 77.75%; 自动固定 mvp 场景/无预热/封顶重放,
#   详见 agentx_runner.py 头部说明）
# ============================================================================
agentx:
  # agentx 可执行文件（环境变量 AGENTX_BIN 优先）。
  # 这里指向 kit 自带的独立 venv（agentx-harness 1.0.7，含编译好的 crick 0.0.8），
  # 不用 PATH 上的 agentx —— 宿主 /usr/local/bin 只有坏 wrapper，容器 venv 里
  # 也没装（crick 需编译，容器到 pypi 通道不稳）。
  bin: "/mnt/sfs_turbo/c00803992/evalscope-sla-kit/.cache/agentx-venv/bin/agentx"
  # agentx-harness 需要的子进程环境变量（覆盖 runner 继承的环境）
  # - HF_ENDPOINT: 容器内 huggingface.co 直连不通，走 hf-mirror.com
  # - HF_HOME / HF_HUB_CACHE: 公开语料 + tokenizer 的本地缓存（首次跑会下载 GB 级）
  # - AIPERF_DATASET_MMAP_CACHE_DIR/BASE_PATH: harness 的数据集 mmap 缓存
  # 已预置的缓存（2026-10-30 已有 cc-traces-weka-062126 1.8G + zai-org/GLM-5.3
  # tokenizer, 来自 agentx-eval 的同名缓存软链）:
  #   /mnt/sfs_turbo/c00803992/agentx-eval/hf_cache
  env:
    HF_ENDPOINT: "https://hf-mirror.com"
    HF_HUB_DISABLE_XET: "1"
    HF_HOME: "/mnt/sfs_turbo/c00803992/evalscope-sla-kit/.cache/hf"
    HF_HUB_CACHE: "/mnt/sfs_turbo/c00803992/evalscope-sla-kit/.cache/hf/hub"
    AIPERF_DATASET_MMAP_CACHE_DIR: "/mnt/sfs_turbo/c00803992/evalscope-sla-kit/.cache/aiperf"
    AIPERF_DATASET_MMAP_BASE_PATH: "/mnt/sfs_turbo/c00803992/evalscope-sla-kit/.cache/mmap"
  datasets:
    # "tag, public_dataset | local:<目录>, concurrency [, tokenizer]"
    # tokenizer 留空 = 用 service.tokenizer_path（本地路径）
    - "256k, semianalysis_cc_traces_weka_with_subagents_256k, 16"
    # - "full, semianalysis_cc_traces_weka_062126, 16"
    # 生成: python3 tools/curate_weka_traces.py \
    #         --src <HF快照>/traces.jsonl --out-dir datasets/weka8 \
    #         --main-turns 8 --sessions 80 --target-isl 65000 --target-hit 0.80 \
    #         --max-context 204800 --idle-cap 300
    # - "weka8, local:datasets/weka8, 80"

# ============================================================================
# 功能测试（scripts/run_api_e2e.py, Simaas 风格 API E2E 框架）
# ----------------------------------------------------------------------------
# 用例编号: 单一 C 编号共 50 条（用户矩阵 C01-C41 除 C17/C20 流式空洞外全覆盖,
#   C46 流式已删, C42-C50 的检查并入对应编号, 专有检查续编 C51-C61）
#   总表见 README.md「功能测试」一节
# 用法: bash run.sh --functional            # 后台跑全部用例（日志 logs/func_*.log）
#       bash run.sh --functional -f         # 前台
#       python3 scripts/run_api_e2e.py --list / --dry-run / --only C30
#       python3 scripts/run_api_e2e.py --base-url https://116.204.8.3/infer7 \
#           --model 'glm-5' --header 'Host: sz.glm5.com' --skip-bench \
#           --capability-repeat 10 --insecure
# 判定口径: PASS / FAIL（计入退出码）/ WARN（已知缺陷或可选能力未实现, 不计 FAIL）/ SKIP
# 已知缺陷: reasoning_effort="medium" 在部分服务上必 400 -> 记 WARN（C60）
# ============================================================================
functional:
  # 单请求超时（秒）。思考型模型单次回答可能几十秒; 功能线已全非流式
  # （流式能力由性能线覆盖）, 整体仍给足超时兜底
  timeout_s: 300
  # 输出预算（max_tokens）。GLM-5.3 强制思考, 预算太小会被思考链吃光导致正文为空
  max_tokens: 2048
  efforts: [low, high, xhigh, max] # C56 起的 effort 矩阵档位（medium 由紧随其后的编号专项检查）
  # 跳过的用例（C 编号 / tag / 用例名子串）, 如 [C61, C30]
  skip: []
  # 接口协议族: openai / messages / gemini / embedding（可多选; 当前服务只暴露 openai）
  interface_types: [openai]
  # capability 类用例（/category 以 capability 结尾）重复轮数, 用于抖动检测
  capability_repeat: 1
  # /v1/responses 协议族用例整族开关（C04/C06/C08/C09/C11/C14/C16/C18/C19/C24/C28/C29/C32,
  # 共 13 条, C17 流式已移除）。网关不支持 responses 端点时可置 true 整体跳过; 命令行 --skip-responses-api 同效
  skip_responses_api: false
  # C33 思考深度探针（3 档 effort x3 次共 9 请求, 断言 reasoning 量 low<high<max）。
  # 默认关闭; 置 true 或命令行 --thinking-depth-check 开启
  thinking_depth_check: false
  # C38 超长输入按 service.max_context_length x1.1 构造（未设置该键则 C38 自动 SKIP）
  # 长上下文召回（8k 填充 + needle）默认关闭: 推理模型上耗时高, 需要时置 false
  skip_long_context_api: true
  long_context_api_tokens: 8192    # 长上下文填充 token 数
  output_dir: results/functional   # 报告与各用例响应原文的落盘根目录

# ============================================================================
# BFCL v4 函数调用评测（bfcl_runner.py, Berkeley Function-Calling Leaderboard）
# ----------------------------------------------------------------------------
# 用 evalscope 内置 bfcl_v4 适配器 + bfcl-eval 2025.10.27.1 评函数调用能力,
# 输出 per-subset acc + 官方公式 Overall:
#   Overall = Agentic(web_search+memory)×40% + Multi-Turn×30% + Live×10%
#           + Non-Live×10% + Hallucination×10%（live_relevance 不计分,
#           未跑的类别按 0 分计权——部分子集跑分时 Overall 会偏低, 属预期）
# 用法: bash run.sh --bfcl           # 后台跑启用子集（日志 logs/bfcl_*.log）
#       bash run.sh --bfcl -f        # 前台
#       python3 bfcl_runner.py --list / --dry-run / --only simple_python,irrelevance
#       python3 bfcl_runner.py --limit 10 --only simple_python,irrelevance   # 冒烟
#       python3 bfcl_runner.py --report         # 重打已有结果汇总表
# 评测进程在 ais-bench 容器内的独立 venv 跑（venv_python, NFS 共享盘,
# 容器重建不丢; 不碰 /tmp/bench-venv）; 宿主机发起时自动 docker exec 进容器。
# ============================================================================
bfcl:
  # bfcl-venv 解释器（容器内路径; 需预装 evalscope==1.14.1 + bfcl-eval==2025.10.27.1）
  venv_python: /mnt/sfs_turbo/c00803992/bfcl-venv/bin/python
  # 评测所在容器（宿主机发起 run.sh --bfcl 时经 docker exec 进入）
  container: ais-bench
  # 被测服务（留空 = 用 service.url / service.model / request.api_key）
  # 当前指向 dsv41 PD 服务（SWE-bench_Pro 评测同款端点）
  url: http://192.168.0.9:18020/v1
  model: dsv4
  api_key: "EMPTY"
  # 启用子集（默认离线全集 17 个: Non-Live 6 + Live 4 + Relevance 3 + Multi-Turn 4）
  # web_search / memory 子集默认不开（外部依赖, 见下面两个开关）
  enabled_subsets:
    - simple_python
    - simple_java
    - simple_javascript
    - multiple
    - parallel
    - parallel_multiple
    - live_simple
    - live_multiple
    - live_parallel
    - live_parallel_multiple
    - irrelevance
    - live_irrelevance
    - live_relevance
    - multi_turn_base
    - multi_turn_miss_func
    - multi_turn_miss_param
    - multi_turn_long_context
  # web_search 子集开关: 需要 serpapi_api_key 且有调用额度, 否则该类得 0
  enable_web_search: false
  # memory 子集开关: memory_vector 首次运行需从 HF 下载模型（本机 HF 直连不通）
  enable_memory: false
  # SerpAPI key（web_search 用; 留空 = 不注入）
  serpapi_api_key: ""
  # 每个子集只评 N 条（冒烟）; 0 = 全量
  limit: 0
  # 评测并发（eval_batch_size, 官方示例 10）
  eval_batch_size: 10
  # 采样温度（BFCL 只支持 temperature, 其他生成参数会被忽略）
  temperature: 0
  # 被测模型是否原生支持 function calling; false = 用提示词绕过（非 FC 模型用）
  is_fc_model: true
  # 模型在函数名中拒绝点号时自动把点号转下划线（官方默认 true）
  underscore_to_dot: true

# ============================================================================
# SWE-bench_Pro 精度评测（swe_runner.py, 第七条测试线——只读监控 + 补跑）
# ----------------------------------------------------------------------------
# agentic 精度评测: 模型生成补丁 → 每实例独立 amd64 沙箱容器跑金标测试 →
# resolved 率（ModelScope ScaleAI/SWE-bench_Pro, 实际 642 条）。
# **全量评测不由本 kit 驱动**: live 分批驱动在 /mnt/sfs_turbo/c00803992/swe_pro
# （run_all_batches.sh, 642 实例按窗口 32 分批, 每批拉镜像→评→prune）, 产物
# 也在那里——**勿移动/修改/删除该目录**（watcher/驱动进程正按这些路径工作）。
# 本 runner 只提供 status / aggregate / rerun-list / env-check / start-rerun。
# 用法: bash run.sh --swe status        # 状态总览（--swe 后透传子命令）
#       python3 swe_runner.py status --json
#       python3 swe_runner.py aggregate
#       python3 swe_runner.py start-rerun        # 打印补跑命令（dry-run）
# 注意: url/model 不回退 service 段——live 评测固定打 dsv4 服务, 与 kit 的
# service 段（glm5.3 网关）指向不同, 必须显式写。
# ============================================================================
swe:
  # live 工作区（驱动脚本/logs/results/rerun 清单都在这里; --work-dir 可覆盖,
  # 未显式配置的派生路径会跟着它推）
  work_dir: /mnt/sfs_turbo/c00803992/swe_pro
  # 评测结果 work-dir（reviews/predictions/swe_bench_pro_log; 聚合器读它）
  results_dir: /mnt/sfs_turbo/c00803992/swe_pro/results/accuracy/swe_bench_pro_dsv4
  # 补跑清单（EVALSCOPE_INSTANCE_FILE 按行取 instance_id; '#' 行是分组注释）
  rerun_ids: /mnt/sfs_turbo/c00803992/swe_pro/rerun_ids.txt
  # SWE-bench_Pro-os 仓库（固定 commit ca10a60; extra_params 指定免重复 clone）
  repo_path: /mnt/sfs_turbo/c00803992/swe_bench_pro_os/repo
  # 被测服务（dsv4 PD 服务; 不回退 service 段, 见上方说明）
  api_url: http://192.168.0.9:18020/v1/chat/completions
  model: dsv4
  # 容器内 evalscope 客户端 venv（摸高/精度线同款; 切勿往里装东西）
  venv: /tmp/bench-venv
  # 评测所在容器（宿主机发起时经 docker exec 进容器）
  container: ais-bench
  # docker unix relay socket（容器内沙箱经它调宿主 dockerd; 勿用 TCP 代理）
  relay_socket: /mnt/sfs_turbo/c00803992/dockersock/docker.sock
  # docker 根盘（每批 ~66GB 镜像涨落, status 报余量; 容器内不可见）
  disk_mount: /mnt/docker
  # 每批实例数（run_all_batches.sh WINDOW, 仅状态展示用）
  batch_window: 32
  # 数据集总条数（实际 642; 文档写 731 不准）
  total_instances: 642
  # 补跑默认批内并发（start-rerun 未显式给 --eval-batch-size 时）
  eval_batch_size: 16
